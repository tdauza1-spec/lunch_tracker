<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lunch Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent-green: #2d5a27; /* Forest green */
            --accent-light: #4caf50;
            --danger: #cf6679;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            margin-top: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .balance-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        .balance-label {
            color: var(--text-muted);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #333;
            padding-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        /* Using inputmode="decimal" forces the iPhone number pad */
        input[type="number"] {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-main);
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--accent-light);
        }

        .btn-add {
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-add:active {
            opacity: 0.7;
        }

        .btn-reset {
            width: 100%;
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-reset:active {
            background-color: #333;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Weekly Lunch Tracker</h1>
        
        <div class="balance-card">
            <div class="balance-label">Remaining Balance</div>
            <div class="balance-amount" id="remainingText">$75.00</div>
            
            <div class="stats-row">
                <div>Budget: $75.00</div>
                <div>Spent: $<span id="spentText">0.00</span></div>
            </div>
        </div>

        <div class="input-group">
            <input type="number" id="expenseInput" inputmode="decimal" placeholder="Enter amount..." step="0.01">
            <button class="btn-add" onclick="addExpense()">Add</button>
        </div>

        <button class="btn-reset" onclick="resetWeek()">Start New Week</button>
    </div>

    <script>
        const WEEKLY_BUDGET = 75.00;
        // Retrieve saved spent amount from local storage, or default to 0
        let spent = parseFloat(localStorage.getItem('lunchSpentData')) || 0.00;

        const remainingText = document.getElementById('remainingText');
        const spentText = document.getElementById('spentText');
        const expenseInput = document.getElementById('expenseInput');

        function updateDisplay() {
            const remaining = WEEKLY_BUDGET - spent;
            
            spentText.innerText = spent.toFixed(2);
            
            // Format remaining amount
            let prefix = remaining < 0 ? "-$" : "$";
            remainingText.innerText = prefix + Math.abs(remaining).toFixed(2);

            // Change color based on remaining budget
            if (remaining < 0) {
                remainingText.style.color = 'var(--danger)'; // Red if over budget
            } else if (remaining <= 15) {
                remainingText.style.color = '#ffb74d'; // Orange if close to limit
            } else {
                remainingText.style.color = 'var(--accent-light)'; // Green if good
            }
        }

        function addExpense() {
            const amount = parseFloat(expenseInput.value);
            
            if (!isNaN(amount) && amount > 0) {
                spent += amount;
                localStorage.setItem('lunchSpentData', spent.toString());
                expenseInput.value = ''; 
                expenseInput.blur(); // Dismisses the iPhone keyboard
                updateDisplay();
            }
        }

        function resetWeek() {
            if (confirm('Are you sure you want to reset your budget for a new week?')) {
                spent = 0.00;
                localStorage.setItem('lunchSpentData', spent.toString());
                updateDisplay();
            }
        }

        // Initialize the UI on first load
        updateDisplay();
    </script>

</body>
</html>
